name: Enviar Boletin Diario

on:
  schedule:
    # 04:30 UTC -> 06:30 Hora de España
    - cron: '30 4 * * *'
    # 10:00 UTC -> 12:00 Hora de España
    - cron: '0 10 * * *'
    # 13:00 UTC -> 15:00 Hora de España
    - cron: '0 13 * * *'
  workflow_dispatch: # Permite lanzarlo manualmente desde la pestaña Actions en GitHub

jobs:
  ejecutar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Instalar ffmpeg del sistema
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Instalar dependencias
        run: pip install pydub google-genai lxml requests

      - name: Ejecutar script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python boletin_estado_trafico.py
        
